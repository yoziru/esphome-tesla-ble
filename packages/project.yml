esphome:
  project:
    name: yoziru.esphome-tesla-ble
    version: "2026.7.0"

esp32_ble_tracker:
  scan_parameters:
    # Depending on the model and state, BLE advertisements come every 20ms or every 150ms.
    interval: 150ms
    # Single-core chips (NanoC6 = ESP32-C6) share one core between WiFi and BLE;
    # scan only once WiFi is up, see https://esphome.io/components/esp32_ble_tracker/#use-on-single-core-chips
    continuous: false

wifi:
  on_connect:
    - esp32_ble_tracker.start_scan:
        continuous: true
  on_disconnect:
    - esp32_ble_tracker.stop_scan:
