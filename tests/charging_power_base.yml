# Fixture-only configuration. No device or vehicle is contacted by codegen/builds.
substitutions:
  device_name: tesla-ble-power-default-test
  ble_mac_address: "A0:B1:C2:D3:E4:F5"
  tesla_vin: "5YJ30123456789ABC"
  vcsec_poll_interval: "10"
  infotainment_poll_interval_awake: "30"
  infotainment_poll_interval_active: "10"
  infotainment_sleep_timeout: "660"

external_components:
  - source:
      type: local
      path: ../components
    components: [tesla_ble_vehicle, tesla_ble_listener]

packages:
  common: !include ../packages/common.yml
  hardware: !include ../packages/board.yml
  board: !include ../boards/esp32-generic.yml
  client: !include ../packages/client.yml

esphome:
  name: ${device_name}

logger:
api:
wifi:
  ssid: !secret test_wifi_ssid
  password: !secret test_wifi_password
